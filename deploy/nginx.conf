worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/knowbox-trust.conf;

    map $http_origin $request_origin {
        "" "http://$http_host";
        default $http_origin;
    }
    map $http_origin $api_origin {
        "" "";
        default "http://127.0.0.1:7879";
    }
    map $http_host $api_authorization {
        include /tmp/knowbox-auth/*.conf;
    }
    map $uri $site_policy {
        /assets/diagram.html "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'self'; sandbox allow-scripts; base-uri 'none'; object-src 'none'; form-action 'none'";
        default "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'none'";
    }
    map $uri $resource_policy {
        /assets/diagram-frame.js cross-origin;
        /assets/mermaid.min.js cross-origin;
        default same-origin;
    }

    server {
        listen 0.0.0.0:7878 default_server;
        root /srv/explorer;
        client_max_body_size 1k;
        set $expected_origin "http://$http_host";

        if ($trusted_network = 0) { return 403; }
        if ($allowed_host = 0) { return 403; }
        if ($request_origin != $expected_origin) { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        add_header Cache-Control no-store always;
        add_header Content-Security-Policy $site_policy always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy $resource_policy always;

        location ^~ /api/ {
            if ($api_authorization = "") { return 503; }
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:7879";
            proxy_set_header Origin $api_origin;
            proxy_set_header Connection "close";
            proxy_set_header Authorization $api_authorization;
            proxy_pass http://127.0.0.1:7879;
        }
        location ~ ^/assets/([a-zA-Z0-9_-]+(?:\.[a-zA-Z0-9_-]+)*\.(?:js|css|html|LICENSE|txt))$ {
            alias /srv/explorer/$1;
            disable_symlinks on from=/srv/explorer;
        }
        location /assets/ { return 404; }
        location = / { try_files /index.html =404; }
        location ~ "^/[a-zA-Z0-9_-]+(?:/[a-zA-Z0-9_-]+)*/?$" {
            try_files /index.html =404;
        }
        location / { return 404; }
    }
}
